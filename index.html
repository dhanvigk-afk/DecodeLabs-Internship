<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextPick AI - Career Recommendation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🤖 NextPick AI</h1>
    <p>Find your ideal tech career based on your interests.</p>

    <div class="options">
        <label><input type="checkbox" value="Technology"> Technology</label>

        <label><input type="checkbox" value="Programming"> Programming</label>

        <label><input type="checkbox" value="Artificial Intelligence"> Artificial Intelligence</label>

        <label><input type="checkbox" value="Web Development"> Web Development</label>

        <label><input type="checkbox" value="Machine Learning"> Machine Learning</label>

        <label><input type="checkbox" value="Data Science"> Data Science</label>
    </div>

    <button onclick="recommend()">🚀 Get Recommendation</button>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
